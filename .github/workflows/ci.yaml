name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - maru.10
      - maru.11
      - staging
    paths-ignore:
      - '**.md'
      - 'doc/**'

  pull_request:
    branches:
      - maru.10
      - maru.11
    paths-ignore:
      - '**.md'
      - 'doc/**'

jobs:
  build-linux-amd64:
    name: "linux x86_64"
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/attila-lendvai/maru-ci:amd64
      options: --init

    steps:
      - name: System info
        run: |
          echo "===== OS Info ====="
          echo "CI image version: $CI_IMAGE_VERSION"
          uname -a
          echo Kernel page size: $(getconf PAGE_SIZE)
          sw_vers || lsb_release -a || cat /etc/os-release || true
          echo "===== CPU Info ====="
          uname -m
          sysctl -n machdep.cpu.brand_string || lscpu || true
          echo "===== Environment ====="
          env

      - name: Calm down Git
        run: git config --global --add safe.directory /__w/maru/maru

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - run:  clang --version || true
      - run:  cc --version || true

      - run:  test -d build/ && find build/ -type f -exec touch '{}' + || true

      - run:  timeout 5m ./build.sh bootstrap llvm libc
      - run:  timeout 5m ./build.sh bootstrap llvm posix
      - run:  timeout 5m ./build.sh bootstrap llvm linux
      - run:  timeout 5m ./build.sh bootstrap x86  linux
      # the self-contained x86 binaries are mapped/run through musl's
      # ELF interpreter instead of glibc's
      - run:  timeout 5m ./build.sh ld.so=/lib/ld-musl-x86_64.so.1 bootstrap x86 linux

      - run:  timeout 5m ./build.sh profiler=1 bootstrap llvm posix
      - run:  timeout 5m ./build.sh profiler=1 bootstrap llvm linux

      - run:  timeout 5m ./build.sh test

      - name: Bootstrap with *safety* set to 3
        run: |
          sed -i 's/(define \*safety\* 1)/(define \*safety\* 3)/' boot.l
          timeout 5m ./build.sh bootstrap llvm linux
          timeout 5m ./build.sh bootstrap x86  linux

  build-linux-arm64:
    name: "linux aarch64"
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/attila-lendvai/maru-ci:arm64
      options: --init

    steps:
      - name: System info
        run: |
          echo "===== OS Info ====="
          echo "CI image version: $CI_IMAGE_VERSION"
          uname -a
          echo Kernel page size: $(getconf PAGE_SIZE)
          sw_vers || lsb_release -a || cat /etc/os-release || true
          echo "===== CPU Info ====="
          uname -m
          sysctl -n machdep.cpu.brand_string || lscpu || true
          echo "===== Environment ====="
          env

      - name: Calm down Git
        run: git config --global --add safe.directory /__w/maru/maru

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - run:  clang --version || true
      - run:  cc --version || true

      - run:  test -d build/ && find build/ -type f -exec touch '{}' + || true

      - run:  timeout 5m ./build.sh bootstrap llvm libc
      - run:  timeout 5m ./build.sh bootstrap llvm posix
      - run:  timeout 5m ./build.sh bootstrap llvm linux

      # same as above on amd64: only the arm backend embeds an ELF
      # interpreter, so llvm would silently not exercise musl here
      - run:  timeout 5m ./build.sh ld.so=/lib/ld-musl-aarch64.so.1 bootstrap arm linux

      - run:  timeout 5m ./build.sh profiler=1 bootstrap llvm posix
      - run:  timeout 5m ./build.sh profiler=1 bootstrap llvm linux

      - run:  timeout 5m ./build.sh test

  build-darwin:
    name: "darwin aarch64"
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: System info
        run: |
          echo "===== OS Info ====="
          uname -a
          sw_vers || lsb_release -a || cat /etc/os-release || true
          echo "===== CPU Info ====="
          uname -m
          sysctl -n machdep.cpu.brand_string || lscpu || true
          echo "===== Environment ====="
          env

      - name: Calm down Git
        run: git config --global --add safe.directory /__w/maru/maru

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Install clang
        # this action caches the archives, but not the install
        # itself. it's simpler this way, but it takes about a minute.
        uses: gerlero/brew-install@v1
        with:
          packages: llvm coreutils

      # - name: Cache Homebrew packages
      #   uses: actions/cache@v4
      #   with:
      #     # Paths to cache:
      #     # /usr/local/Homebrew - installation folder of Homebrew
      #     # /usr/local/Cellar - installation folder of Homebrew formulae
      #     # /usr/local/Frameworks, /usr/local/bin, /usr/local/opt - contain (links to) binaries installed by Homebrew formulae
      #     # /usr/local/lib/python3.12 - Python3 packages installation
      #     # /opt/homebrew - Apple Silicon path
      #     path: |
      #       /usr/local/Homebrew
      #       /usr/local/Cellar
      #       /usr/local/Frameworks
      #       /usr/local/bin
      #       /usr/local/opt
      #       /opt/homebrew

      #     key: macos-build-cache-${{ hashFiles('**/Brewfile') }}
      #     restore-keys: macos-build-cache-

      # - name: Install packages from Homebrew
      #   run: |
      #     brew update
      #     brew install llvm || echo "clang already installed from cache"

      - name: Add Homebrew LLVM to PATH
        run: echo "$(brew --prefix llvm)/bin:$(brew --prefix coreutils)/bin" >> $GITHUB_PATH

      - run:  clang --version || true
      - run:  cc --version || true

      - run:  test -d build/ && find build/ -type f -exec touch '{}' + || true

      - run:  timeout 3m arch -arm64  ./build.sh bootstrap llvm libc

      - run:  timeout 3m arch -arm64  ./build.sh bootstrap llvm posix

      - run:  timeout 3m arch -arm64  ./build.sh profiler=1 bootstrap llvm posix

      - run:  timeout 3m ./build.sh test

# TODO fix and reenable
  build-linux-amd64-full-bootstrap:
    if: false && github.ref != 'refs/heads/staging'
    name: "linux x86_64 full bootstrap"
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/attila-lendvai/maru-ci:amd64
      options: --init

    steps:
      - name: System info
        run: |
          echo "===== OS Info ====="
          echo "CI image version: $CI_IMAGE_VERSION"
          uname -a
          echo Kernel page size: $(getconf PAGE_SIZE)
          sw_vers || lsb_release -a || cat /etc/os-release || true
          echo "===== CPU Info ====="
          uname -m
          sysctl -n machdep.cpu.brand_string || lscpu || true
          echo "===== Environment ====="
          env

      - name: Calm down Git
        run: git config --global --add safe.directory /__w/maru/maru

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - run:  clang --version && cc --version

      - run:  timeout 20m ./build.sh test-bootstrap-recursively
