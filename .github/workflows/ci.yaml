name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - maru.10
      - maru.11
      - staging
    paths-ignore:
      - '**.md'
      - 'doc/**'

  pull_request:
    branches:
      - maru.10
      - maru.11
    paths-ignore:
      - '**.md'
      - 'doc/**'

jobs:

###
# x86_64 Linux
###
  build-linux-amd64:
    name: "linux x86_64"
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/attila-lendvai/maru-ci:amd64
      options: --init

    steps:
      - name: Calm down Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - run: tools-for-build/ci-linux.sh --native

###
# aarch64 Linux, cross-built from x86_64
###

  build-linux-amd64-cross:
    name: "linux x86_64 -> aarch64"
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/attila-lendvai/maru-ci:amd64
      options: --init
    env:
      BUILD_TIMEOUT: 10m

    steps:
      - name: Calm down Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - run: tools-for-build/ci-linux.sh --cross

###
# aarch64 Linux
###

  build-linux-arm64:
    name: "linux aarch64"
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/attila-lendvai/maru-ci:arm64
      options: --init

    steps:
      - name: Calm down Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - run: tools-for-build/ci-linux.sh --native

###
# Darwin
###

  build-darwin:
    name: "darwin aarch64"
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Calm down Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-brew-${{ hashFiles('tools-for-build/install-macos-deps.sh') }}
          restore-keys: macos-brew-

      - name: Install dependencies
        run: tools-for-build/install-macos-deps.sh

      - name: Run CI
        run: tools-for-build/ci-macos.sh

###
# Full bootstrap
###

# TODO fix and reenable
  build-linux-amd64-full-bootstrap:
    if: false && github.ref != 'refs/heads/staging'
    name: "linux x86_64 full bootstrap"
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/attila-lendvai/maru-ci:amd64
      options: --init
    env:
      TERM: xterm

    steps:
      - name: System info
        run: |
          echo "===== OS Info ====="
          echo "CI image version: $CI_IMAGE_VERSION"
          uname -a
          echo Kernel page size: $(getconf PAGE_SIZE)
          sw_vers || lsb_release -a || cat /etc/os-release || true
          echo "===== CPU Info ====="
          uname -m
          sysctl -n machdep.cpu.brand_string || lscpu || true
          echo "===== Environment ====="
          env

      - name: Calm down Git
        run: git config --global --add safe.directory /__w/maru/maru

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - run:  clang --version && cc --version

      - run:  timeout 20m ./build.sh test-bootstrap-recursively

